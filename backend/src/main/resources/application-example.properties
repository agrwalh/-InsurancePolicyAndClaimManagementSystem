spring.application.name=InsurancePolicyAndClaimManagementSystem

spring.datasource.url=jdbc:mysql://localhost:3306/YOUR_DATABASE
spring.datasource.username=YOUR_DB_USERNAME
spring.datasource.password=YOUR_DB_PASSWORD
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# JWT
app.jwt.secret=YOUR_JWT_SECRET
app.jwt.expiration=YOUR_JWT_EXPIRATION

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html

# Server
server.port=8080

# Logging
logging.level.com.springFirst=INFO

# Cloudinary
cloudinary.cloud-name=YOUR_CLOUDINARY_CLOUD_NAME
cloudinary.api-key=YOUR_CLOUDINARY_API_KEY
cloudinary.api-secret=YOUR_CLOUDINARY_API_SECRET

# Multipart
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

app.upload.allowed-types=jpg,jpeg,png,pdf
app.upload.max-file-size-mb=10

# Email
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=YOUR_EMAIL
spring.mail.password=YOUR_EMAIL_APP_PASSWORD
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# OTP
app.otp.expiry-minutes=YOUR_OTP_EXPIRY
app.otp.max-attempts=YOUR_OTP_MAX_ATTEMPTS
app.otp.resend-cooldown-seconds=YOUR_OTP_COOLDOWN
app.phone.default-country-code=YOUR_COUNTRY_CODE

# Twilio
twilio.account-sid=YOUR_TWILIO_ACCOUNT_SID
twilio.auth-token=YOUR_TWILIO_AUTH_TOKEN
twilio.verify-service-sid=YOUR_TWILIO_VERIFY_SERVICE_SID
twilio.enabled=false

# Razorpay
razorpay.key.id=YOUR_RAZORPAY_KEY_ID
razorpay.key.secret=YOUR_RAZORPAY_KEY_SECRET

spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms
spring.data.redis.connect-timeout=2000ms
#spring.data.redis.password=YOUR_REDIS_PASSWORD
